name: 안드로이드 앱 빌드 (구글플레이)
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['index.html', 'img/**', 'android/**', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: 게임 파일을 앱에 넣기
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html android/app/src/main/assets/www/
          cp -r img android/app/src/main/assets/www/
      - name: AAB(서명 전) 빌드
        working-directory: android
        env: { VERSION_CODE: '${{ github.run_number }}' }
        run: gradle --no-daemon bundleRelease assembleRelease assembleDebug
      - run: |
          mkdir -p out
          cp android/app/build/outputs/bundle/release/app-release.aab out/johapjang-unsigned.aab
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk out/johapjang-unsigned.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk out/johapjang-test.apk
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: 안드로이드 빌드 (서명 전, 최신)
          body: 서명 전 AAB/APK. 업로드 키로 서명한 뒤 구글플레이 콘솔에 올립니다. versionCode ${{ github.run_number }}
          files: |
            out/johapjang-unsigned.aab
            out/johapjang-unsigned.apk
            out/johapjang-test.apk
