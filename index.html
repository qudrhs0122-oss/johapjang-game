<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#281814">
<link rel="apple-touch-icon" href="img/icon-192.png">
<title>조합장 키우기 — 재건축은 처음이라</title><style>
:root{--bg:#efe9df;--card:#fffdf9;--ink:#26221d;--sub:#776c60;--line:#e2d9cb;--red:#c4472f;--green:#2f8a55;--gold:#d39b1f;--blue:#35659c;--chat:#dfe8f1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;font-size:15px}
#app{max-width:480px;margin:0 auto;padding:10px 12px 40px;min-height:100vh}
button{font-family:inherit}
.btn{display:block;width:100%;border:none;border-radius:12px;padding:13px 14px;font-size:15px;font-weight:700;background:var(--ink);color:#fff;cursor:pointer;text-align:left;margin-top:8px;line-height:1.35}
.btn:active{transform:scale(.98)}
.btn.center{text-align:center}
.btn.ghost{background:#e9e1d4;color:var(--ink)}
.btn.gold{background:var(--gold);color:#352500}
.btn.red{background:var(--red)}
.btn:disabled{opacity:.45}
.btn .k{display:inline-block;width:22px;height:22px;border-radius:6px;background:rgba(255,255,255,.18);text-align:center;line-height:22px;font-size:12px;margin-right:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
/* HUD */
.top{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 8px}
.top .t1{font-size:12px;color:var(--sub)}
.top .t2{font-size:16px;font-weight:800;letter-spacing:-.4px}
.top .ch{font-size:11px;background:var(--ink);color:#fff;border-radius:999px;padding:4px 9px;white-space:nowrap}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 10px;padding:12px}
.m .lb{font-size:11px;color:var(--sub);display:flex;justify-content:space-between}
.m .lb b{color:var(--ink);font-size:12px}
.bar{height:6px;background:#ebe3d6;border-radius:99px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;border-radius:99px;transition:width .4s}
.econ{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;cursor:pointer}
.econ .v{font-size:18px;font-weight:800}
.econ .s{font-size:11px;color:var(--sub)}
.up{color:var(--red)} .dn{color:var(--green)}
/* event */
.who{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.av{width:42px;height:42px;border-radius:12px;background:#f1e9dc;display:flex;align-items:center;justify-content:center;font-size:24px}
.who .n{font-weight:800;font-size:14px}
.who .r{font-size:12px;color:var(--sub)}
.cat{margin-left:auto;font-size:11px;padding:3px 8px;border-radius:99px;background:#f3ece0;color:var(--sub)}
.ev h2{font-size:19px;line-height:1.35;margin:0 0 8px;letter-spacing:-.4px}
.ev p{color:#4a433b;line-height:1.6;margin:0 0 6px;font-size:14.5px}
.odds{font-size:13px;background:#fff4dc;border:1px solid #f0dca8;border-radius:10px;padding:8px 10px;margin:8px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{font-size:12px;font-weight:700;padding:4px 8px;border-radius:8px;background:#eee}
.chip.g{background:#e1f2e7;color:var(--green)} .chip.b{background:#fae3dd;color:var(--red)}
.res p{font-size:15px}
/* chat */
.chat{background:var(--chat);border-radius:16px;padding:12px;margin-bottom:10px}
.chat .hd{font-size:13px;font-weight:800;margin-bottom:8px;display:flex;justify-content:space-between}
.chat .hd span{font-weight:400;color:var(--sub)}
.msg{margin:8px 0}
.msg .nm{font-size:11px;color:var(--sub);margin:0 0 2px 4px}
.msg .bb{display:inline-block;background:#fff;border-radius:4px 14px 14px 14px;padding:8px 11px;font-size:14px;max-width:88%;line-height:1.45}
/* misc */
.title{text-align:center;padding:40px 10px 10px}
.title .logo{font-size:56px}
.title h1{font-size:30px;margin:8px 0 2px;letter-spacing:-1px}
.title .subt{color:var(--sub);font-size:14px}
.title blockquote{margin:24px 8px;font-size:15px;line-height:1.6;color:#4a433b}
.chapter{text-align:center;padding:50px 10px}
.chapter .no{font-size:13px;color:var(--sub);letter-spacing:2px}
.chapter h1{font-size:28px;margin:6px 0 10px}
.chapter .stars{color:var(--gold);font-size:18px}
.chapter p{color:#4a433b;line-height:1.6}
.adrow{display:flex;gap:6px}
.adrow .btn{font-size:13px;padding:10px;text-align:center}
.log{font-size:12px;color:var(--sub);max-height:150px;overflow:auto}
.log div{padding:4px 0;border-bottom:1px dashed var(--line)}
.grade{font-size:84px;font-weight:900;text-align:center;line-height:1;margin:10px 0}
.rep{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rep div{background:#f5efe5;border-radius:10px;padding:9px}
.rep .a{font-size:11px;color:var(--sub)} .rep .b{font-size:16px;font-weight:800}
.modal{position:fixed;inset:0;background:rgba(25,20,15,.6);display:flex;align-items:center;justify-content:center;padding:18px;z-index:9}
.modal .box{background:var(--card);border-radius:16px;padding:16px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
.fake{background:#1d1d1d;color:#aaa;border-radius:12px;height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;text-align:center}
.fake b{font-size:38px;color:#fff;margin-top:8px}
table.fin{width:100%;font-size:13px;border-collapse:collapse}
table.fin td{padding:6px 2px;border-bottom:1px solid var(--line)}
table.fin td:last-child{text-align:right;font-weight:700}
input[type=range]{width:100%}
.small{font-size:11px;color:var(--sub);line-height:1.5}
.fade{animation:fd .25s ease-out}
@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* ---- v0.3 장면 연출 ---- */
.top{gap:8px}
.mini-me{width:40px;height:40px;border-radius:12px;background:#fff;overflow:hidden;flex:none;border:1px solid var(--line)}
.scene{position:relative;height:178px;border-radius:16px;overflow:hidden;margin-bottom:10px;border:1px solid var(--line)}
.scene .por svg{display:block;width:100%;height:100%}
.scene .big{position:absolute;left:6px;bottom:0;width:150px;height:150px}
.scene .me{position:absolute;right:4px;bottom:0;width:108px;height:108px;transform:scaleX(-1)}
.scene .group{position:absolute;left:0;bottom:0;width:200px;height:150px}
.scene .group .mini{position:absolute;bottom:0;width:96px;height:96px}
.scene .group .g0{left:0}.scene .group .g1{left:58px;bottom:18px;width:104px;height:104px}.scene .group .g2{left:122px}
.scene .plate{position:absolute;left:10px;top:10px;background:rgba(255,253,249,.92);border-radius:10px;padding:5px 9px;font-size:12px;color:var(--sub);max-width:62%}
.scene .plate b{color:var(--ink)}
.scene .meplate{position:absolute;right:10px;top:10px;background:rgba(38,34,29,.82);color:#fff;border-radius:10px;padding:5px 9px;font-size:11px}
.scene.fail{background:linear-gradient(180deg,#3b2f2f 0%,#3b2f2f 62%,#2a2222 62%)}
.scene.end{background:linear-gradient(180deg,#f7e6c4 0%,#f7e6c4 62%,#efc983 62%)}
.ev .cat{display:inline-block;margin:0 0 8px;font-size:11px;padding:3px 8px;border-radius:99px;background:#f3ece0;color:var(--sub)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.pk{border:2px solid var(--line);background:#fff;border-radius:14px;padding:6px;cursor:pointer;font-family:inherit}
.pk svg{width:100%;height:auto;display:block}
.pk span{display:block;font-size:12px;color:var(--sub);margin-top:2px}
.pk.on{border-color:var(--ink);background:#fbf4e8}
input#pname{width:100%;font-size:16px;padding:11px;border-radius:10px;border:1px solid var(--line);margin-top:4px;font-family:inherit}
.castrow{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.castrow div{width:62px;font-size:11px;color:var(--sub)}
.castrow .mini{width:58px;height:58px;background:#fff;border-radius:12px;overflow:hidden;margin:0 auto 2px}
.castrow .mini svg{width:100%;height:100%}
.titlecast{position:relative;height:150px;margin:0 auto 6px;max-width:330px}
.titlecast .por{position:absolute;bottom:0;width:120px;height:120px}
.titlecast .por svg{width:100%;height:100%}
.titlecast .t1{left:0}.titlecast .t2{left:95px;width:140px;height:140px;z-index:2}.titlecast .t3{right:0}
.msg{display:flex;gap:8px;align-items:flex-start}
.msg .mav{width:36px;height:36px;border-radius:12px;background:#fff;overflow:hidden;flex:none}
.msg .mav svg{width:100%;height:100%}

/* ---- v0.4 미연시 연출 ---- */
.scene{position:relative;height:300px;border-radius:16px 16px 0 0;overflow:hidden;margin-bottom:0;border:none;background:#ddd}
.scene .bg,.titlecast .bg{position:absolute;inset:0}.scene .bg svg,.titlecast .bg svg{width:100%;height:100%;display:block}
.scene .bg:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0) 55%,rgba(255,255,255,.35))}
.scene .por svg{display:block;width:100%;height:100%}
.scene .main{position:absolute;left:50%;bottom:-34px;width:250px;height:300px;transform:translateX(-64%);filter:drop-shadow(0 4px 10px rgba(0,0,0,.18));animation:enter .35s ease-out}
.scene .me{position:absolute;right:-22px;bottom:-36px;width:168px;height:202px;transform:scaleX(-1);filter:drop-shadow(0 3px 8px rgba(0,0,0,.2))}
.scene .group{position:absolute;left:0;bottom:-30px;width:250px;height:260px}
.scene .group .t{position:absolute;bottom:0;width:150px;height:180px}
.scene .group .g0{left:-10px}.scene .group .g1{left:62px;bottom:20px;width:160px;height:192px}.scene .group .g2{left:128px}
@keyframes enter{from{opacity:0;transform:translateX(-58%)}to{opacity:1;transform:translateX(-64%)}}
.scene .plate{position:absolute;left:10px;bottom:0;top:auto;background:#2b2f4a;color:#fff;border-radius:12px 12px 0 0;padding:7px 14px 6px;font-size:15px;font-weight:800;max-width:70%;z-index:3}
.scene .plate span{display:block;font-size:11px;font-weight:400;opacity:.75}
.scene .meplate{position:absolute;right:8px;top:8px;background:rgba(43,47,74,.85);color:#fff;border-radius:10px;padding:5px 9px;font-size:11px;z-index:3}
.scene + .card{border-radius:0 0 16px 16px;border:none;border-top:4px solid #2b2f4a;box-shadow:0 6px 16px rgba(43,47,74,.12)}
.scene + .card .btn:not(.gold):not(.ghost){background:#fff;color:#2b2f4a;border:2px solid #2b2f4a;box-shadow:0 3px 0 #2b2f4a}
.scene + .card .btn.red{background:#fff;color:#a8322a;border-color:#a8322a;box-shadow:0 3px 0 #a8322a}
.scene + .card .btn .k{background:#2b2f4a;color:#fff}
.scene + .card .btn.red .k{background:#a8322a}
.scene + .card #next{background:#2b2f4a;color:#fff}
.scene.fail .bg{filter:grayscale(.8) brightness(.6)}
.titlecast{position:relative;height:250px;margin:0 -12px 10px;overflow:hidden;border-radius:0 0 20px 20px}
.titlecast .por{position:absolute;bottom:-30px;width:170px;height:204px}
.titlecast .t1{left:-6px}.titlecast .t3{right:-6px}.titlecast .t2{left:50%;transform:translateX(-50%);width:210px;height:252px;bottom:-40px}
.title{padding-top:0}
.pk svg{background:linear-gradient(#f4ecdf,#fff)}
.castrow .mini{width:58px;height:58px}

/* ---- v0.5 이미지 입간판 · 말풍선 · 실시간 ---- */
.por.img{overflow:visible}
.por.img img{display:block;width:100%;height:100%;object-fit:contain;object-position:50% 100%}
.scene .por.img.main{bottom:-6px;width:270px;height:300px;transform:translateX(-66%)}
@keyframes enter{from{opacity:0;transform:translateX(-58%)}to{opacity:1;transform:translateX(-66%)}}
.scene .por.img.me{right:-26px;bottom:-4px;width:175px;height:195px}
.scene .group .por.img{width:150px;height:170px}
.por .fx{position:absolute;top:6%;right:16%;font-style:normal;font-size:30px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.scene .me .fx{transform:scaleX(-1);right:30%;font-size:24px}
.m-angry .fx{animation:fxpulse .6s ease-in-out infinite alternate}
.m-angry.main img{animation:shake .45s ease-in-out 2}
.m-shock img{animation:jump .35s ease-out 1}
.m-smile .fx{animation:twinkle 1.2s ease-in-out infinite}
.m-worried .fx{animation:drip 1.4s ease-in infinite}
.m-tired img{filter:saturate(.7) brightness(.95)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes jump{0%{transform:translateY(0)}40%{transform:translateY(-14px)}100%{transform:translateY(0)}}
@keyframes fxpulse{from{transform:scale(1)}to{transform:scale(1.25)}}
@keyframes twinkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
@keyframes drip{0%{transform:translateY(-4px);opacity:0}30%{opacity:1}100%{transform:translateY(10px);opacity:0}}
img.fc{width:100%;height:100%;object-fit:cover;object-position:50% 18%;display:block}
.castrow .mini{background:#fff}
.pk img{width:100%;height:auto;display:block;background:linear-gradient(#e9f2f8,#fff);border-radius:10px}
.titlecast .por.img{bottom:-8px}
/* 말풍선 */
.bubble{position:absolute;top:12px;right:12px;max-width:56%;background:#fff;border:2.5px solid #2b2f4a;border-radius:18px;padding:9px 12px;font-size:14.5px;font-weight:800;line-height:1.4;color:#2b2f4a;z-index:4;box-shadow:0 3px 0 rgba(43,47,74,.25)}
.bubble:after{content:"";position:absolute;left:14px;bottom:-13px;border:7px solid transparent;border-top:12px solid #2b2f4a;border-right-width:2px}
.bubble:before{content:"";position:absolute;left:16px;bottom:-8px;border:5px solid transparent;border-top:9px solid #fff;border-right-width:1px;z-index:1}
.mebubble{position:absolute;right:118px;bottom:150px;max-width:46%;background:#2b2f4a;color:#fff;border-radius:16px;padding:8px 12px;font-size:14px;font-weight:800;z-index:4}
.mebubble:after{content:"";position:absolute;right:-10px;bottom:10px;border:6px solid transparent;border-left:12px solid #2b2f4a}
.pop{animation:pop .3s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.scene .meplate{top:auto;bottom:8px;right:8px}
.narr{font-size:14.5px;line-height:1.65;color:#4a433b;background:#f7f2ea;border-radius:10px;padding:10px 12px}
.replies-h{margin:12px 2px 0;text-align:right}
.scene + .card .btn.reply{border-radius:18px 18px 4px 18px;margin-left:12%;width:88%}
/* 실시간 */
.mbar{height:4px;background:#e6ddcf;border-radius:9px;overflow:hidden;margin-top:3px}
.mbar i{display:block;height:100%;background:linear-gradient(90deg,#d39b1f,#c4472f);transition:width .2s linear}
.econ{display:block}
.erow{display:flex;justify-content:space-between;align-items:center}
.fin-tick{font-size:12px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);color:var(--sub)}
.fin-tick b{color:var(--ink);font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#2b2f4a;color:#fff;padding:10px 14px;border-radius:12px;font-size:13px;z-index:20;max-width:90%;animation:pop .3s}
/* ---- 단지 선택 ---- */
.cxcard{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;font-family:inherit;cursor:pointer}
.cxcard:active{border-color:#2b2f4a;transform:scale(.99)}
.cxtop{display:flex;justify-content:space-between;gap:8px}
.cxn{font-size:17px;font-weight:900;color:var(--ink)}
.cxs{color:#c4472f;font-size:13px;white-space:nowrap}.cxs span{color:#ddd}
.cxnums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0 8px}
.cxnums div{background:#f6f0e6;border-radius:10px;padding:7px 8px}
.cxnums span{display:block;font-size:11px;color:var(--sub)}
.cxnums b{font-size:17px;color:var(--ink)}.cxnums b.up{color:var(--red)}
.cxnums i{display:block;font-size:10px;font-style:normal;color:var(--sub)}
.cxtags{display:flex;flex-wrap:wrap;gap:4px}
.cxtags span{font-size:11px;background:#2b2f4a;color:#fff;border-radius:99px;padding:3px 8px}
.cxnote{margin-top:6px}

body:has(.tposter){background:radial-gradient(120% 70% at 50% 30%,#5a4660,#241b28)}
.tposter{margin:-10px -12px -40px;background:#2c2230;overflow:hidden;min-height:100vh;display:flex;flex-direction:column}
.tposter .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.tposter img{display:block;width:100%;height:auto}
.tp-mid{background:linear-gradient(180deg,#634a57 0%,#8a6a83 50%,#c698af 100%);padding:14px 0 18px;display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:-1px}
.tp-btn{width:66%;max-width:330px;padding:14px 0;border:0;border-radius:40px;font-size:26px;font-weight:900;letter-spacing:-.5px;color:#3a2410;cursor:pointer;
 background:linear-gradient(180deg,#fff3c4 0%,#ffd76a 40%,#f6b73c 100%);box-shadow:0 0 0 3px #f8e3a6 inset,0 0 0 2px #b9812a,0 6px 0 #a86b1d,0 10px 22px rgba(0,0,0,.35),0 0 26px rgba(255,214,110,.55);font-family:inherit}
.tp-btn:active{transform:translateY(3px);box-shadow:0 0 0 3px #f8e3a6 inset,0 0 0 2px #b9812a,0 3px 0 #a86b1d,0 6px 14px rgba(0,0,0,.35)}
.tp-btn.ghost{font-size:17px;padding:9px 0;width:46%;background:rgba(255,255,255,.18);color:#fff;box-shadow:0 0 0 1.5px rgba(255,255,255,.6) inset}
.tp-bot{position:relative;margin-top:-1px;flex:1;background:linear-gradient(180deg,#5f4440,#3a2c3c 120px)}
.tp-bot p{margin:0;padding:12px 0 24px;text-align:center;color:#f3e6ef;font-size:13px;text-shadow:0 1px 3px rgba(0,0,0,.6)}

body:has(.cxpage){background:linear-gradient(180deg,#dfe2f3 0,#efe6ee 300px,#f3ebe8 100%)}
.cxpage{margin:-10px -12px 0;padding:0 10px 10px}
.cxhead{position:relative;margin:0 -10px -30px;aspect-ratio:851/246;min-height:215px;background:url(img/cx_head.webp) 70% bottom/cover;padding:22px 14px 0}
.cxhead h2{margin:0;font-size:25px;line-height:1.25;font-weight:900;letter-spacing:-1px;color:#1f2034;text-shadow:0 1px 0 rgba(255,255,255,.7)}
.cxhead p{margin:8px 0 0;font-size:12px;line-height:1.5;color:#3d3b4a;max-width:58%;text-shadow:0 1px 0 rgba(255,255,255,.7)}
.cxpage .cxcard{position:relative;background:#fff;border:0;border-radius:22px;padding:16px 14px 14px;margin-bottom:14px;box-shadow:0 4px 18px rgba(80,60,90,.12)}
.cxpage .cxcard:active{transform:scale(.985);box-shadow:0 0 0 2px #2b3566,0 4px 18px rgba(80,60,90,.12)}
.cxpage .cxtop{align-items:center}
.cxpage .cxn{font-size:22px;letter-spacing:-.6px}
.cxpage .cxs{font-size:17px;color:#e2412c}.cxpage .cxs span{color:#d9d6d6}
.cxmeta{font-size:12px;color:#5a5560;margin-top:4px}
.cxpage .cxnums{gap:8px;margin:12px 0 10px}
.cxpage .cxnums div{background:linear-gradient(180deg,#fcf3e8,#f8ece0);border-radius:14px;padding:10px 10px}
.cxpage .cxnums span{font-size:11.5px;color:#5c5245}
.cxpage .cxnums b{display:block;font-size:22px;margin:2px 0;letter-spacing:-.5px}
.cxpage .cxnums i{font-size:11px}
.cxpage .cxtags{gap:6px}
.cxpage .cxtags span{font-size:12px;font-weight:700;background:#323c6b;padding:6px 12px;border-radius:99px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.cxnote{font-size:12px;color:#3d3b4a;margin-top:10px;line-height:1.5}

.edex summary{cursor:pointer;font-weight:900;font-size:15px;list-style:none}.edex summary b{color:var(--red)}
.edgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:10px}
.ed{display:flex;align-items:center;gap:6px;background:#f2ede6;border-radius:10px;padding:7px 8px;font-size:12px;color:#a59c90;font-weight:700}

er": 1, "title": "“우리 상가 권리는 누가 보장합니까?”", "category": "상가", "who": "sangga", "description": "단지 상가에서 30년째 세탁소를 하는 권상가가 앞치마 차림으로 찾아왔습니다.", "choices": [{"id": "A", "text": "상가 협의체를 만들겠다고 약속한다", "effects": {"support": 2, "legal_risk": -5}, "flag": "sanggaEarly", "result": "권상가가 처음으로 웃었습니다. 상가 쪽 동의서가 들어오기 시작합니다."}, {"id": "B", "text": "“상가 문제는 나중에 봅시다.”", "effects": {"opposition": 5, "legal_risk": 8}, "result": "상가 조합원 40명이 등을 돌렸습니다."}, {"id": "C", "text": "상가 전문 컨설턴트를 붙인다", "effects": {"funds": -1, "legal_risk": -6}, "result": "비용은 들었지만 상가 권리 문제의 쟁점이 정리됐습니다."}]}, {"id": "CH01-E05", "chapter": 1, "title": "안전진단 비용을 모아야 합니다", "category": "재무", "who": "clerk", "description": "재건축의 첫 관문은 안전진단입니다. 자원봉사로 합류한 서기록이 말합니다. “용역비가 꽤 듭니다. 어떻게 마련하죠?”", "choices": [{"id": "A", "text": "세대별 자율 모금을 한다", "effects": {"funds": 2, "support": -2, "transparency": 3}, "result": "모금 현황판을 엘리베이터에 붙였습니다. 내는 사람도, 안 내는 사람도 서로를 봅니다."}, {"id": "B", "text": "외부 대여금을 받는다", "effects": {"funds": 3, "finance": 20, "legal_risk": 2}, "result": "돈은 빨리 마련됐지만 이자 조건이 붙었습니다."}, {"id": "C", "text": "내 돈으로 먼저 낸다", "effects": {"funds": 2, "stress": 8, "support": 5}, "result": "“저 사람 진심이네.” 지지율이 올랐고 배우자의 표정은 굳었습니다."}]}, {"id": "CH01-E06", "chapter": 1, "title": "“제가 추진위원장 하겠습니다.”", "category": "정치", "who": "bandae", "mood": "normal", "description": "같은 동에 사는 박반대가 손을 들었습니다. 전직 건설회사 부장 출신이라며 경력을 강조합니다.", "choices": [{"id": "A", "text": "공개 경선을 제안한다", "effects": {"stress": 5, "transparency": 5, "support": 2, "opposition": 3}, "result": "경선 날짜가 잡혔습니다. 박반대는 “좋습니다, 정정당당하게”라고 했습니다."}, {"id": "B", "text": "공동위원장을 제안한다", "effects": {"opposition": -5, "stress": 6}, "flag": "coChair", "result": "어색한 동거가 시작됐습니다. 회의마다 의견이 두 개씩 나옵니다."}, {"id": "C", "text": "주민 추천서를 모아 밀어붙인다", "effects": {"support": 4, "opposition": 9}, "result": "당신이 추진위원장 후보로 확정됐습니다. 박반대의 눈빛이 달라졌습니다."}]}, {"id": "CH01-E07", "chapter": 1, "title": "안전진단 결과 발표", "category": "절차", "who": "official", "description": "보완해 주무관이 결과 공문을 건넵니다. 판정은 ‘조건부 재건축’. 한숨과 환호가 동시에 터집니다.", "choices": [{"id": "A", "text": "“통과다!” 축하 현수막을 건다", "effects": {"support": 6, "funds": -0.3}, "result": "‘경축 안전진단 통과’ 현수막 앞에서 다들 사진을 찍었습니다."}, {"id": "B", "text": "다음 절차와 남은 리스크를 차분히 공지한다", "effects": {"transparency": 6, "support": 2}, "result": "“이제 시작이구나.” 분위기가 진지해졌습니다."}, {"id": "C", "text": "정밀 검토 요청에 대비해 자료를 보강한다", "effects": {"funds": -0.5, "legal_risk": -4}, "result": "서류철이 두꺼워졌습니다. 서기록이 처음으로 한숨을 쉬었습니다."}]}, {"id": "CH01-E08", "chapter": 1, "title": "추진위원회 승인 신청 · 동의서 과반 확보전", "category": "보스전", "who": "jirap", "special": "vote", "diff": 0.15, "description": "추진위원회 승인을 받으려면 토지등소유자 과반수의 동의서가 필요합니다. 마감까지 일주일, 동의서 함이 아직 반쯤 비어 있습니다.", "vote_text": "마지막 일주일, 총력전에 들어간다", "win": "동의서 과반 확보! 구청이 추진위원회 구성을 승인했습니다. 당신은 이제 ‘추진위원장’입니다.", "win_fx": {"support": 4, "stress": -4}, "fail": "nopromo"}, {"id": "CH02-E01", "chapter": 2, "title": "“저는 분담금 0원으로 재건축하겠습니다!”", "category": "선거", "who": "bandae", "mood": "smile", "description": "조합장 선거가 시작됐습니다. 상대 후보 박반대의 첫 공약이 단지 곳곳에 붙었습니다. 사람들이 당신에게 묻습니다. “그쪽 공약은 뭐예요?”", "choices": [{"id": "A", "text": "현실적인 사업성을 숫자로 공개한다", "effects": {"support": -5, "transparency": 10}, "flag": "honest", "result": "“재미는 없는데 믿음은 간다.” 지지층은 작지만 단단합니다."}, {"id": "B", "text": "최고급 브랜드 유치를 약속한다", "effects": {"support": 8}, "flag": "brandPromise", "result": "지지율이 뛰었습니다. 이 약속은 시공사 선정 때 다시 돌아옵니다."}, {"id": "C", "text": "모든 조합원에게 큰 평형을 약속한다", "effects": {"support": 12, "legal_risk": 8}, "flag": "bigPromise", "result": "선거 사무실에 사람이 몰렸습니다. 평형 배정 날이 벌써 걱정됩니다."}]}, {"id": "CH02-E02", "chapter": 2, "title": "선거 캠프를 꾸려야 합니다", "category": "선거", "who": "kim", "description": "정비업체 대표 김계약이 명함을 내밉니다. “선거 홍보물, 저희가 싸게 해 드릴 수 있습니다. 나중에 잘 봐주시면 되고요.”", "choices": [{"id": "A", "text": "거절하고 자원봉사자로 캠프를 꾸린다", "effects": {"transparency": 4, "stress": 5}, "result": "홍보물은 투박하지만 떳떳합니다."}, {"id": "B", "text": "오지랖에게 홍보를 맡긴다", "effects": {"support": 5, "legal_risk": 3}, "result": "단톡방 홍보력은 최강입니다. 가끔 사실과 다른 말이 섞입니다."}, {"id": "C", "text": "김계약의 제안을 받는다", "effects": {"support": 한다", "effects": {"transparency": 12, "funds": -0.5, "support": 5, "opposition": -5, "stress": 5}, "flag": "disclosed", "result": "외부 회계 검증 결과를 첨부해 공지했습니다. 의혹의 파급력이 눈에 띄게 줄었습니다."}, {"id": "B", "text": "법률 검토 후 허위사실에 대응한다", "effects": {"legal_risk": -3, "funds": -1, "opposition": 6, "stress": 6}, "result": "내용증명이 발송됐습니다. 비대위는 '조합장이 조합원을 고소하려 한다'고 반격합니다."}, {"id": "C", "text": "주민설명회를 열고 직접 설득한다", "effects": {"support": 6, "months": 1, "stress": 5}, "result": "설명회장은 고성으로 시작했지만 끝까지 질문에 답하자 박수도 나왔습니다. 일정은 한 달 밀렸습니다."}]}, {"id": "CH04-E03", "chapter": 4, "title": "정보공개 청구가 하루 40건씩 들어옵니다", "category": "투명성", "who": "wonchik", "description": "원칙파 조합원 최원칙이 말합니다. \"조합은 자료를 공개할 의무가 있습니다. 숨길 게 없다면 공개하세요.\" 사무장은 이미 야근 중입니다.", "choices": [{"id": "A", "text": "주요 자료를 홈페이지에 전부 상시 공개한다", "effects": {"transparency": 15, "funds": -0.3, "stress": 4}, "flag": "openbook", "result": "최원칙이 단톡방에 \"이번 건은 조합이 잘했다\"고 썼습니다. 원칙파가 중립으로 돌아섰습니다."}, {"id": "B", "text": "요청 건만 기한 안에 처리한다", "effects": {"transparency": 5, "stress": 3}, "result": "법정 기한은 지켰지만 같은 자료 요청이 계속 반복됩니다."}, {"id": "C", "text": "바쁘니 일단 미룬다", "effects": {"transparency": -10, "legal_risk": 12, "opposition": 8}, "result": "최원칙이 공개 지연을 문제 삼아 구청에 민원을 넣었습니다."}]}, {"id": "CH04-E04", "chapter": 4, "title": "단톡방이 세 개로 쪼개졌습니다", "category": "여론", "who": "jirap", "description": "'재건축 공식방', '진짜 조합원방', '비대위 소식방'. 단톡방장 오지랖이 세 방을 오가며 말을 옮기고 있습니다.", "choices": [{"id": "A", "text": "조합 공식 공지 채널을 따로 만든다", "effects": {"funds": -0.2, "transparency": 5, "support": 3}, "result": "공지는 공식 채널로만 나간다는 원칙이 생겼습니다. 지라시 출처가 분명해지기 시작합니다."}, {"id": "B", "text": "모든 방에 직접 들어가 해명한다", "effects": {"stress": 8, "support": 4}, "alt": [{"noflag": "disclosed", "effects": {"stress": 10, "support": -3, "opposition": 4}, "result": "근거 자료 없이 해명하자 \"그럼 자료를 보여주세요\"라는 답만 돌아왔습니다."}], "result": "공개해 둔 회계자료 링크를 붙이자 말이 줄었습니다."}, {"id": "C", "text": "단톡방에는 관여하지 않는다", "effects": {"opposition": 6}, "result": "빈자리를 비대위의 말이 채웠습니다."}]}, {"id": "CH04-E05", "chapter": 4, "title": "“조합원 10분 const CX=st=>COMPLEXES[(st&&st.cx)||0];
function T(t){ if(!S||S.cx===undefined) return t; const c=CX(S);
  return String(t).replace(/은하 로얄 리버파크/g,c.short+" 로얄 리버파크").replace(/은하아파트/g,c.name).replace(/은하마을/g,c.short+"마을")
   .replace(/1,500세대/g,c.hh.toLocaleString()+"세대").replace(/2,200세대/g,c.newHH.toLocaleString()+"세대").replace(/40년/g,(2027-c.built)+"년"); }
function econ(st){ // 화면 표시용: 단지 실제 규모로 환산
  const i=econI(st), c=CX(st), ratio=c.ratio0+(i.ratio-RATIO_I0)*c.rk;
  return {cost:i.cost*c.cs, ratio, dues:c.price-c.asset*ratio/100, rev:i.cost*c.cs+ratio/100*c.baseTotal};
}

function econI(st){const cost=st.construction+st.finance+st.other, ratio=(st.revenue-cost)/BASE_ASSET; return {cost,ratio:ratio*100,dues:MY_PRICE-MY_ASSET*ratio};}
const fmtEok=x=>{const v=Math.round(x*100)/100;return (v<0?"-":"")+Math.abs(v).toFixed(2)+"억";};
const fmtWon=x=>x>=10000?(Math.floor(x/10000)+"조 "+Math.round(x%10000).toLocaleString()+"억"):Math.round(x).toLocaleString()+"억";
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dateStr=m=>(2027+Math.floor(m/12))+"년 "+(m%12+1)+"월";
const SEC_PER_DAY=2, DAYS=30;
const MI={1:0.6,2:0.9,3:1.5,4:2.4,5:3,6:3.6,7:5,8:7,9:8.5,10:8.5,11:7,12:3}; // 월 이자(억)
const perDay=()=>(MI[chNo()]||4)/DAYS;
function viability(){const e=econ(S), r=e.dues/CX(S).market; return r<0.1?["양호","dn"]:r<0.2?["보통",""]:r<0.4?["주의","up"]:["위험","up"];}

// ===== 효과 =====
function apply(eff){
  const before=econ(S).dues, delta={};
  for(const k in eff){
    if(k==="months"){S.month+=eff.months; delta.months=eff.months;
      S.funds-=0.35*eff.months; S.finance+=(MI[chNo()]||4)*eff.months; S.stress+=eff.months; S.opposition+=1.5*eff.months; continue;}
    S[k]=(S[k]||0)+eff[k]; delta[k]=eff[k];
  }
  const dd=(econ(S).dues-before)/CX(S).market*10;
  if(dd>0.05){const o=Math.min(15,Math.round(dd*10)),s=Math.min(10,Math.round(dd*6)); S.opposition+=o; S.support-=s; delta.opposition=(delta.opposition||0)+o; delta.support=(delta.support||0)-s;}
  else if(dd<-0.05){const s=Math.min(6,Math.round(-dd*4)); S.support+=s; delta.support=(delta.support||0)+s;}
  normalize(); return delta;
}
function monthTick(auto){
  if(!auto){ S.finance+=perDay()*Math.max(0,DAYS-(S.day||1)); }
  S.day=1; S.dayAcc=0;
  const dd=(econ(S).dues-(S.lastDues||econ(S).dues))/CX(S).market*10; S.lastDues=econ(S).dues;
  if(dd>0.03){S.opposition+=Math.min(6,Math.round(dd*12)); S.support-=Math.min(4,Math.round(dd*6));}
  S.month++; S.turn++; S.funds-=0.3; if(S.turn%2) S.stress++;
  let o=0; if(S.transparency<40)o+=2; if(S.transparency>70)o-=2; if(S.support<45)o+=2; if(S.support>70)o-=1;
  if(chNo()<2) o=Math.min(o,1);
  if(S.transparency>=60) S.legal_risk-=1;
  S.opposition+=o; normalize();
}
function normalize(){["support","opposition","legal_risk","transparency","stress"].forEach(k=>S[k]=clamp(Math.round(S[k]),0,100)); S.funds=Math.round(S.funds*10)/10;}
function netGood(d){let n=0;for(const k in d){if(GOOD[k]) n+=Math.sign(d[k])*GOOD[k];}return n;}
function chipsHTML(d){
  return Object.keys(d).filter(k=>d[k]&&LABEL[k]).map(k=>{const v=d[k],good=(v>0?1:-1)*GOOD[k]>0;
    const unit=["funds","construction","finance","other","revenue"].includes(k)?"억":(k==="months"?"개월":"");
    return `<span class="chip ${good?'g':'b'}">${LABEL[k]} ${v>0?'+':''}${Math.round(v*10)/10}${unit}</span>`;}).join("");
}
function addLog(t){S.log.unshift(dateStr(S.month)+" · "+t); S.log=S.log.slice(0,80);}
function mkCP(){return JSON.stringify(Object.assign({},S,{snap:null,cp:null}));}

// ===== 사건 흐름 =====
function trig(t){
  if(!t) return true;
  if(t.flag&&!S.flags[t.flag]) return false;
  if(t.noflag&&S.flags[t.noflag]) return false;
  if(t.opposition_min&&S.opposition<t.opposition_min) return false;
  if(t.support_max&&S.support>t.support_max) return false;
  if(t.legal_min&&S.legal_risk<t.legal_min) return false;
  if(t.stress_min&&S.stress<t.stress_min) return false;
  if(t.chapter_min&&chNo()<t.chapter_min) return false;
  return true;
}
function chapterEvents(){return EVENTS.filter(e=>e.chapter===chNo()&&trig(e.trigger));}
function nextStory(){
  const list=chapterEvents();
  if(S.ei>=list.length){ S.chi++; S.ei=0; S.phase=S.chi>=ORDER.length?"ending":"chapter"; return; }
  S.cur={kind:"story",id:list[S.ei].id}; S.ei++; S.phase="event";
}
function maybeInterrupt(){
  const ch=chNo();
  if(ch>=4&&(S.support<20||S.opposition>=70)&&S.month-S.lastDismiss>=6&&!(ch===4&&S.ei<11)){S.cur={kind:"dismiss"};S.phase="event";return true;}
  if(S.turn-S.quizTurn>=3){
    S.quizTurn=S.turn;
    const max=Math.min(10,Math.max(2,ch));
    let pool=QUIZ.filter(q=>q.lv<=max&&!S.quizSeen.includes(q.n)); if(!pool.length) pool=QUIZ.filter(q=>!S.quizSeen.includes(q.n));
    if(pool.length){const q=pool[Math.floor(Math.random()*pool.length)]; S.cur={kind:"quiz",n:q.n,order:[0,1,2,3].sort(()=>Math.random()-.5),hint:false}; S.phase="quiz"; return true;}
  }
  if(Math.random()<0.15+S.opposition/400+S.stress/500){
    const pool=RANDOM.filter(e=>trig(e.trigger)&&!S.flags["seen_"+e.id]);
    if(pool.length){const e=pool[Math.floor(Math.random()*pool.length)]; S.cur={kind:"random",id:e.id}; S.phase="event"; return true;}
  }
  if(S.turn-S.chatTurn>=3){S.chatTurn=S.turn; S.phase="chat"; S.chatMsgs=pickChats(); return true;}
  return false;
}
function getEvent(){
  if(S.cur.kind==="story") return EVENTS.find(e=>e.id===S.cur.id);
  if(S.cur.kind==="random") return RANDOM.find(e=>e.id===S.cur.id);
  return {id:"X-DISMISS",title:"긴급 해임총회",category:"보스전",who:"bandae",mood:"angry",special:"dismiss_vote",description:"민심이 바닥입니다. 비대위가 해임총회를 소집했습니다.",choices:[]};
}

// ===== 특수 사건 (표결·판결) =====
const VB=0.12, hasV=()=>S.items.legal>0, useV=()=>{if(hasV()){S.items.legal--;return VB;}return 0;};
const vNote=()=>hasV()?`<br>⚖️ 법률 자문권 1장을 자동으로 사용합니다 (+${VB*100}%p, 보유 ${S.items.legal}장)`:"";
function oddsText(p){return p>0.8?"압도적 우세":p>0.6?"우세":p>0.45?"박빙":p>0.3?"열세":"절대 열세";}
function riseNow(){return Math.max(0,(econ(S).dues-S.dues0)/S.dues0);}
function voteOdds(ev){
  let p=0.55+(S.support-50)/85-(S.opposition-40)/150+(S.transparency-50)/280-(S.legal_risk-30)/250-riseNow()*0.6+(ev.diff||0);
  if(ev.diff_if) for(const f in ev.diff_if) if(S.flags[f]) p+=ev.diff_if[f];
  return clamp(p,0.06,0.95);
}
function oddsBox(p,extra){return `<div class="odds">📊 사전 판세: <b>${oddsText(p)}</b> · 지지율 ${S.support}% · 비대위 ${S.opposition}%${extra||""}${vNote()}</div>`;}
function specialChoices(ev){
  if(ev.special==="vote"){
    const p=Math.min(0.97,voteOdds(ev)+(hasV()?VB:0));
    return {extra:oddsBox(p),choices:[{id:"A",text:ev.vote_text,fn:()=>{useV();
      if(Math.random()<p) return {d:apply(ev.win_fx||{}),r:ev.win,mood:"smile"};
      S.ending=ev.fail; return {d:{},r:ENDINGS[ev.fail].d,mood:"shock"};}}]};
  }
  if(ev.special==="dismiss_vote"){
    let p=0.5+(S.support-50)/90-(S.opposition-40)/140-(S.legal_risk-30)/220+(S.transparency-50)/250;
    p=Math.min(0.97,clamp(p,0.06,0.94)+(hasV()?VB:0));
    return {extra:oddsBox(p,`<br><span class="small">근거 없는 의혹은 투명성이 높을수록 힘을 잃고, 실제 법적 문제가 쌓여 있으면 비대위에 유리합니다.</span>`),
      choices:[{id:"A",text:"총회장에서 정면 승부한다",fn:()=>{S.dismissTries++;S.lastDismiss=S.month;useV();
          if(Math.random()<p) return {d:apply({opposition:-25,support:8,stress:10}),r:"개표 결과 해임안 부결. 박반대가 말없이 체육관을 나갔습니다. 조합장 자리를 지켰습니다.",mood:"smile"};
          S.ending="dismissed"; return {d:{},r:"개표 결과 해임안 가결. 당신은 더 이상 조합장이 아닙니다.",mood:"shock"};}},
        {id:"B",text:"총회 전 비대위와 막판 협상을 한다",fn:()=>{S.dismissTries++;S.lastDismiss=S.month;
          return {d:apply({opposition:-18,support:-4,stress:10,other:100,transparency:4}),r:"감사 한 명을 비대위 추천 인사로 바꾸는 조건으로 해임안이 철회됐습니다."};}},
        {id:"C",text:"스스로 물러난다",fn:()=>{S.ending="resign";return {d:{},r:"마이크 앞에서 사퇴를 선언했습니다.",mood:"tired"};}}]};
  }
  if(ev.special==="injunction_result"){
    let p=0.55+(S.transparency-50)/200-(S.legal_risk-30)/150;
    if(S.flags.inj_lawyer)p+=0.12; if(S.flags.inj_proof)p+=0.15; if(S.flags.inj_none)p-=0.3;
    p=Math.min(0.97,clamp(p,0.05,0.95)+(hasV()?VB:0));
    return {extra:oddsBox(p),choices:[{id:"A",text:"결정문을 연다",fn:()=>{useV();
      if(Math.random()<p){S.lawWin++;return {d:apply({opposition:-10,support:5,stress:-5}),r:"기각. 법원은 비대위가 주장한 사유가 직무집행을 정지할 만큼 소명되지 않았다고 봤습니다.",mood:"smile"};}
      S.lawLose++;S.ending="suspended";return {d:apply({opposition:10,support:-10}),r:"인용. 법원이 조합장 직무집행을 정지했습니다.",mood:"shock"};}}]};
  }
  if(ev.special==="suit_result"){
    const settled=S.flags.suit_fix||S.flags.suit_settle;
    let p=clamp(0.5+(S.transparency-50)/150-(S.legal_risk-30)/120+(S.flags.suit_lawyer?0.15:0),0.05,0.95);
    if(!settled) p=Math.min(0.97,p+(hasV()?VB:0));
    return {extra:settled?"":oddsBox(p),choices:[{id:"A",text:"판결문을 확인한다",fn:()=>{
      if(settled){S.lawWin++;return {d:apply({support:3}),r:S.flags.suit_fix?"재결의로 흠을 보완해 소송은 각하됐습니다.":"원고 측과 합의해 소송이 취하됐습니다.",mood:"smile"};}
      if(Math.random()<p+useV()){S.lawWin++;return {d:apply({support:5,opposition:-8}),r:"원고 청구 기각. 관리처분계획은 유효합니다.",mood:"smile"};}
      S.lawLose++;return {d:apply({legal_risk:15,support:-8,months:3,other:200}),r:"일부 패소. 분담금 산정 일부를 다시 해야 합니다. 석 달이 더 걸립니다.",mood:"worried"};}}]};
  }
  if(ev.special==="final"){
    return {extra:`<div class="odds">🏁 마지막 안건입니다. 지금까지의 모든 선택이 성적표에 반영됩니다.</div>`,choices:[{id:"A",text:"해산 안건을 상정한다",fn:()=>{S.ending="complete";
      return {d:{},r:"조합 해산 안건 가결. 청산인이 선임됐습니다. 체육관 불이 꺼집니다.",mood:"smile"};}}]};
  }
  if(ev.special==="market"){
    const up=(S.turn%2)===0;
    return {extra:`<p>${up?"📈 주변 신축 시세가 뛰었습니다. 일반분양 수입 전망이 좋아졌습니다.":"📉 거래가 얼어붙었습니다. 일반분양 수입 전망이 나빠졌습니다."}</p>`,
      choices:[{id:"A",text:"확인",fn:()=>({d:apply({revenue:up?700:-700}),r:up?"분담금 부담이 줄었습니다.":"분담금 부담이 커졌습니다."})}]};
  }
  return null;

const ADS={client:"", test:true};
let adOn=false;
if(ADS.client){
  const sc=document.createElement("script"); sc.async=true; sc.crossOrigin="anonymous";
  sc.src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client="+ADS.client;
  sc.setAttribute("data-ad-frequency-hint","30s"); if(ADS.test) sc.setAttribute("data-adbreak-test","on");
  document.head.appendChild(sc);
  window.adsbygoogle=window.adsbygoogle||[]; window.adBreak=window.adConfig=function(o){window.adsbygoogle.push(o);};
  adConfig({preloadAdBreaks:"on",sound:"on"});
}
function showAd(cb,inter){
  if(ADS.client&&window.adBreak){
    if(inter){ adBreak({type:"next",name:"chapter_break",beforeAd:()=>{adOn=true;},afterAd:()=>{adOn=false;},adBreakDone:()=>{adOn=false;cb();}}); return; }
    let granted=false;
    adBreak({type:"reward",name:"reward",beforeReward:(show)=>show(),beforeAd:()=>{adOn=true;},afterAd:()=>{adOn=false;},
      adViewed:()=>{granted=true;},adDismissed:()=>{toast("광고를 끝까지 보면 보상을 받을 수 있어요.");},
      adBreakDone:(info)=>{adOn=false; if(granted) cb(); else if(info&&info.breakStatus&&!["dismissed","viewed"].includes(info.breakStatus)) fakeAd(cb,inter);}});
    return;
  }
  fakeAd(cb,inter);
}
function fakeAd(cb,inter){
  let n=inter?3:5;
  modal(`<div class="fake">광고 자리 (테스트)<br>${inter?"전면 광고":"보상형 광고"} 승인 전까지 이 화면이 대신 나옵니다<b id="adN">${n}</b></div><button class="btn center" id="adDone" disabled>광고 시청 중…</button>`);
  const iv=setInterval(()=>{n--; const e=$("#adN"); if(e)e.textContent=n; if(n<=0){clearInterval(iv); const b=$("#adDone"); if(!b)return; b.disabled=false; b.textContent=inter?"닫기 ✕":"보상 받기 🎁"; b.onclick=()=>{closeModal();cb();};}},1000);
}

function pickEnding(rise){
  const q=S.quizN?S.quizOK/S.quizN:0, m=S.month;
  const legend=S.support>=65&&S.legal_risk<35&&rise<=20&&S.transparency>=50;
  const R=[
   ["perfect", S.support>=85&&S.transparency>=75&&S.legal_risk<=15&&rise<=0],
   ["refund", rise<=-10],
   ["lawking", S.lawWin>=4&&S.lawLose===0],
   ["quizking", S.quizN>=20&&q>=0.9],
   ["bomb", rise>=60],
   ["court", S.legal_risk>=65],
   ["phoenix", S.dismissTries>=3&&S.support>=50],
   ["cohabit", S.opposition>=65],
   ["iv", S.stress>=85],
   ["politician", S.support>=75&&S.opposition<=20],
   ["fastest", m<96&&S.support>=50],
   ["slowest", m>=168],
   ["surplus", S.funds>=30],
   ["glass", S.transparency>=85],
   ["consultant", S.transparency>=65&&q>=0.7],
   ["scout", S.support>=65&&m<=120&&S.legal_risk<30],
   ["legend_"+CX(S).id, legend],
   ["youtuber", S.stress<=30&&S.support>=50],
   ["elder", m>=144&&S.support>=55],
   ["sellout", rise>=40&&rise<60],
   ["cold", S.support<40],
   ["survive", true]];
  return R.find(r=>r[1])[0];
}

function grpShift(d,cat){
  if(!S||!S.grp) return; const g=S.grp, b={live:0,old:0,invest:0,big:0,small:0};
  if(d.construction>0||d.finance>0||d.other>0){b.invest-=2;b.small-=3;} if(d.construction<0){b.invest+=2;b.small+=2;}
  if(d.months>0){b.live-=3;b.old-=1;b.invest-=1;} if(d.revenue>0){b.invest+=3;} if(d.revenue<0){b.invest-=3;b.small-=1;}
  if(d.transparency>0){b.small+=1;b.big+=1;b.old+=1;} if(d.legal_risk>0){b.old-=2;}
  if(cat==="이주"){b.old-=3;b.live+=1;} if(cat==="설계"){b.big+=2;b.small-=2;} if(cat==="분담금"){b.small-=2;b.big+=1;} if(cat==="상가"){b.invest+=1;}
  for(const k in g) g[k]=clamp(g[k]+b[k],-40,40);
  const m=Object.keys(g).reduce((s,k)=>s+g[k]*GRP[k][2],0); for(const k in g) g[k]=Math.round(g[k]-m); // 가중 평균은 0 → 전체 지지율과 일치
}
const grpVal=k=>clamp(S.support+S.grp[k],0,100);

const _apply1=apply;
apply=function(eff,cat){
  if(S&&S.ab&&eff){ eff=Object.assign({},eff); const a=S.ab;
    if(eff.stress>0) eff.stress*=1-a.hp/250;
    if(eff.construction>0) eff.construction*=Math.max(0.5,1-a.nego/300-(S.rel.min-50)/600);
    if(eff.finance>0) eff.finance*=1-a.fin/300; if(eff.other>0) eff.other*=1-a.fin/350;
    if(eff.legal_risk>0) eff.legal_risk*=1-a.law/300;
    if(eff.support>0) eff.support*=1+a.pol/300;
    if(eff.months>0) eff.months=Math.max(0,Math.round(eff.months*(1-a.adm/250)));
    for(const k in eff) if(k!=="months"&&typeof eff[k]==="number") eff[k]=Math.round(eff[k]*10)/10;
  }
  const d=_apply1(eff); grpShift(d,cat); return d;
};

let planPick=[];
function evPerQ(){return (MODES[S.mode]||MODES.normal).ev;}
function goPlan(){S.endQ=0; S.qStarted=0; S.phase="plan";}
function renderPlan(){
  const a=S.ab;
  $("#app").innerHTML=hud()+`<div class="card fade plan"><div class="small">📅 ${qStr()} · 조합장 ${yrsAsBoss()}년 차</div><h2 style="margin:2px 0 4px">이번 분기 일정</h2>
   <div class="small">두 가지 일에 집중할 수 있습니다. 모든 일을 할 시간은 없습니다.</div>
   <div class="acts">${ACTS.map(x=>`<button class="act ${planPick.includes(x.id)?'on':''}" data-a="${x.id}"><b>${x.ic} ${x.n}</b><span class="g">▲ ${x.g}</span><span class="b">▼ ${x.b}</span></button>`).join("")}</div>
   <button class="btn center" id="planGo" ${planPick.length===2?'':'disabled'}>${planPick.length===2?'이 일정으로 분기 진행 ▶':`활동 ${2-planPick.length}개 더 고르세요`}</button></div>`+adRow();
  document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{const id=b.dataset.a;
    planPick=planPick.includes(id)?planPick.filter(x=>x!==id):[...planPick,id].slice(-2); renderPlan();});
  $("#planGo").onclick=()=>{if(planPick.length===2) settlePlan();};
  bindCommon();
}
function settlePlan(){
  S.cp=mkCP(); const lines=[], d={};
  const before={...S.ab};
  planPick.forEach(id=>{const A=ACTS.find(x=>x.id===id); const [dd,txt]=A.fn(); for(const k in dd) d[k]=(d[k]||0)+dd[k]; lines.push(`${A.ic} <b>${A.n}</b> — ${txt}`);});
  // 분기 경과 (3개월)
  for(let i=0;i<3;i++) monthTick();
  S.q++; S.qStarted=1; S.qEv=0;
  if(!planPick.some(x=>x==="family"||x==="health")){relAdd("family",-3);}
  if(S.rel.audit>=65) S.transparency+=1; if(S.rel.audit<30) S.legal_risk+=1;
  if(S.rel.jirap>=65) S.support+=1; if(S.rel.jirap<30) S.support-=1;
  if(S.ab.law>=60) S.legal_risk-=1;
  S.hard=clamp(S.hard+(S.transparency>=65?-1:0)+(S.opposition>=60?1:0),0,100);
  normalize();
  const ab=Object.keys(AB).filter(k=>S.ab[k]!==before[k]).map(k=>`<span class="chip g">${AB[k][0]} ${AB[k][1]} ${S.ab[k]}</span>`).join("");
  S.res={kind:"plan",title:`${qStr()} 일정 결과`,who:planPick.includes("meet")?"bandae":planPick.includes("nego")?"min":planPick.includes("family")?"family":"clerk",cat:"관리",
    r:lines.join("<br>")+`<br><span class="small">⏳ 3개월이 흘렀습니다. 금융비용과 운영비가 나갔습니다.</span>`,d,extra:ab,mood:null};
  addLog("일정: "+planPick.map(id=>ACTS.find(x=>x.id===id).n).join(" + "));
  planPick=[]; S.snap=null; S.cur={kind:"plan"}; S.phase="result"; save(); render();
}

// ----- 이야기 진행: 준비가 잘 되면 실무 안건은 사무장이 처리 -----
function isEssential(e,idx){return idx===0||!!e.special||!!e.trigger||(e.choices||[]).some(c=>c.flag&&FLAGS_USED.has(c.flag));}
function skipP(){const m=MODES[S.mode]||MODES.normal; if(!m.skip) return 0; return clamp(m.skip+S.ab.adm/300+(S.rel.clerk-50)/400,0,0.6);}
nextStory=function(){
  const list=chapterEvents(); let sk=[];
  while(S.ei<list.length&&!isEssential(list[S.ei],S.ei)&&Math.random()<skipP()){sk.push(list[S.ei].title.replace(/[“”"]/g,""));S.ei++;S.skipped++;}
  if(sk.length) setTimeout(()=>toast(`🗂️ 서 사무장이 「${sk[0]}」${sk.length>1?` 외 ${sk.length-1}건`:''}을 처리했습니다`),300);
  if(S.ei>=list.length){ S.chi++; S.ei=0; S.phase=S.chi>=ORDER.length?"ending":"chapter"; return; }
  S.cur={kind:"story",id:list[S.ei].id}; S.ei++; S.phase="event";
};
function advance(){
  const k=S.cur&&S.cur.kind;
  if(k==="plan"){ if(S.studyQuiz){S.studyQuiz=0; if(startQuiz()) return;} nextStory(); return; }
  if(k==="story"){ S.qEv++; if(S.qEv>=evPerQ()){ S.qEv=0; S.endQ=1; if(maybeInterrupt()) return; goPlan(); return; } nextStory(); return; }
  if(S.endQ){ goPlan(); return; }
  nextStory();
}
function startQuiz(){
  const max=Math.min(10,Math.max(2,chNo()+1));
  let pool=QUIZ.filter(q=>q.lv<=max&&!S.quizSeen.includes(q.n)); if(!pool.length) pool=QUIZ.filter(q=>!S.quizSeen.includes(q.n));
  if(!pool.length) return false;
  const q=pool[Math.floor(Math.random()*pool.length)]; S.cur={kind:"quiz",n:q.n,order:[0,1,2,3].sort(()=>Math.random()-.5),hint:false}; S.phase="quiz"; return true;
}
const due=(id,cd)=>!S.xseen[id]&&(!S.xcd[id]||S.q-S.xcd[id]>=cd);
function xev(id){S.cur={kind:"x",id}; S.phase="event"; return true;}
maybeInterrupt=function(){
  const ch=chNo();
  if(ch>=4&&(S.support<20||S.opposition>=80)&&S.month-S.lastDismiss>=6&&!(ch===4&&S.ei<11)){S.cur={kind:"dismiss"};S.phase="event";return true;}
  // 장기 후속 사건 (2년 뒤)
  if(S.hist.verify!==undefined&&S.q-S.hist.verify>=8&&!S.xseen.fu_verify) return xev("fu_verify");
  if(S.hist.acceptCost!==undefined&&S.q-S.hist.acceptCost>=8&&!S.xseen.fu_cost) return xev("fu_cost");
  if(S.rel.min>=70&&S.ab.fin<40&&S.q>=12&&!S.xseen.fu_trap) return xev("fu_trap");
  // 비대위
  if(S.hard<=25&&S.opposition<=35&&ch>=4&&!S.flags.coop&&!S.xseen.coop) return xev("coop");
  if(S.opposition>=40&&ch>=4&&due("split",6)&&Math.random()<0.5) return xev("split");
  if(S.opposition>=50&&ch>=3&&due("banner",8)&&Math.random()<0.35) return xev("banner");
  // 소송 (기회는 여러 번)
  if((S.opposition>=40||S.legal_risk>=30)&&ch>=3&&S.lawsuits<5&&due("lawsuit",5)&&Math.random()<0.4) return xev("lawsuit");
  // 개인생활
  for(const [id,ok] of [["anniv",S.q>=5],["checkup",S.q>=8&&(S.stress>=60||S.ab.hp<30)],["friend",S.q>=10],["grad",S.q>=14],["parent",S.q>=20&&S.rel.family<50],["kidtalk",S.q>=26]])
    if(ok&&!S.xseen[id]&&Math.random()<0.35) return xev(id);
  // 주민 집단 민원
  const low=Object.keys(S.grp).filter(k=>S.grp[k]<=-12&&due("grp_"+k,6));
  if(low.length&&Math.random()<0.5) return xev("grp_"+low[0]);
  if(S.q%2===0&&startQuiz()) return true;
  if(Math.random()<0.15+S.opposition/400+S.stress/500){
    const pool=RANDOM.filter(e=>trig(e.trigger)&&!S.flags["seen_"+e.id]);
    if(pool.length){const e=pool[Math.floor(Math.random()*pool.length)]; S.cur={kind:"random",id:e.id}; S.phase="event"; return true;}
  }
  if(S.q%3===0){S.chatTurn=S.turn; S.cur={kind:"chat"}; S.phase="chat"; S.chatMsgs=pickChats(); return true;}
  return false;
};

  const isBoss=!!ev.special&&ev.special!=="market";

  document.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>choose(ev,choices[+b.dataset.i],sp));

choose=function(ev,c,sp){
  const cp=mkCP(); S.cp=cp; let d,r,mood=null;
  if(c.fn){const o=c.fn(); d=o.d; r=o.r; mood=o.mood;}
  else{
    let eff=c.effects, res=c.result;
    if(c.alt) for(const a of c.alt){ if((a.flag&&S.flags[a.flag])||(a.noflag&&!S.flags[a.noflag])){eff=a.effects;res=a.result;break;} }
    if(c.flag) S.flags[c.flag]=1;
    if(c.special_effect==="audit"){
      const bad=S.legal_risk>=70||S.flags.dinner||S.flags.kimHelp;
      eff=bad?{legal_risk:15,support:-12,opposition:12,stress:8}:{legal_risk:-15,support:6,opposition:-8,stress:5};
      res=bad?"점검 결과 부적절한 계약 관행이 지적됐습니다. 오래전 결정들이 서류 위로 떠올랐습니다.":"점검 결과 중대한 위반은 없었습니다. 그동안의 기록이 당신을 지켰습니다.";
    }
    d=apply(eff,ev.category); r=res;
    const ak=CATAB[ev.category]; if(ak) grow(ak,1);
    if(["계약","공사비","협상","공사"].includes(ev.category)){ if((eff.construction||0)>0) S.hist.acceptCost=S.q; else if((eff.transparency||0)>0) S.hist.verify=S.hist.verify??S.q; }
  }
  const rk={min:"min",clerk:"clerk",audit:"audit",lawyer:"lawyer",jirap:"jirap",family:"family"}[ev.who];
  if(rk&&d){const n=netGood(d); relAdd(rk,n>0?3:n<0?-3:0);}
  if(S.cur.kind==="random") S.flags["seen_"+S.cur.id]=1;
  if(S.cur.kind==="x"){S.xseen[S.cur.id]=["split","banner","lawsuit"].includes(S.cur.id)||S.cur.id.startsWith("grp_")?0:1; S.xcd[S.cur.id]=S.q;}
  S.snap=c.fn?null:cp;
  S.res={title:ev.title,who:ev.who,cat:ev.category,r,d,mood}; addLog(ev.title.replace(/[“”]/g,"")+" → "+c.text);
  S.phase="result"; save(); render();
};
renderResult=function(){

  const other=r.who&&r.who!=="none"?(ng>=1?"smile":ng<0&&r.who==="bandae"?"smile":null):null;
  const line=me==="shock"?"말도 안 돼…!":me==="smile"?["좋았어!","생각대로야.","휴, 다행이다."][S.turn%3]:me==="worried"?["이럴 수가…","이건 좀 아픈데.","하아…"][S.turn%3]:"일단 넘겼다.";
  const nextLbl=S.ending?"결과 보기 ▶":r.kind==="plan"?"이번 분기 사건으로 ▶":"계속 ▶";
  $("#app").innerHTML=hud()+scene(r.who||"none",other,r.cat,me,null,r.who==="family"?"home":null,null,line)+`<div class="card res fade"><div class="small">${r.title}</div><p class="narr" style="margin:8px 0">${T(r.r)}</p><div class="chips">${chipsHTML(r.d||{})}${r.extra||""}</div>

  return r.slice(0,2); }

// 선택지 결과 미리보기 (현실 모드 제외)
const FX_LB={support:"지지율",opposition:"비대위",funds:"자금",legal_risk:"법적위험",transparency:"투명성",stress:"스트레스",construction:"공사비",finance:"금융비",other:"사업비",revenue:"분양수입",months:"기간"};
function fxChips(eff){ if(!eff) return ""; const out=[];
  for(const k in FX_LB){ const v=eff[k]; if(!v) continue; const good=BAD_UP.includes(k)||k==="months"?v<0:v>0; const big=Math.abs(v)>=(k==="funds"?2:k==="construction"||k==="other"||k==="finance"||k==="revenue"?80:k==="months"?3:8);
    out.push(`<i class="fxc ${good?'gd':'bd'}">${FX_LB[k]}${v>0?(big?"▲▲":"▲"):(big?"▼▼":"▼")}</i>`); }
  return out.length?`<span class="fxrow">${out.join("")}</span>`:""; }
function previewChoices(){
  if(!S||S.mode==="real"||S.phase!=="event") return; const ev=getEvent(); if(!ev||ev.special||!ev.choices) return;
  document.querySelectorAll("#app [data-i]").forEach(b=>{ const c=ev.choices[+b.dataset.i]; if(!c||b.querySelector(".fxrow")) return;
    let eff=c.effects; if(c.alt) for(const a of c.alt){ if((a.flag&&S.flags[a.flag])||(a.noflag&&!S.flags[a.noflag])){eff=a.effects;break;} }
    if(c.special_effect==="audit") {b.insertAdjacentHTML("beforeend",`<span class="fxrow"><i class="fxc">결과는 그동안의 기록에 달렸어요</i></span>`);return;}
    if(eff) b.insertAdjacentHTML("beforeend",fxChips(eff)); else if(c.hint) b.insertAdjacentHTML("beforeend",`<span class="fxrow"><i class="fxc">${c.hint}</i></span>`); });
}

       <div class="tut"><b>2</b><span>사건이 오면 선택지를 고르세요. 아래 <i class="fxc gd">초록▲</i><i class="fxc bd">빨강▼</i>이 결과 미리보기예요.</span></div>

       <button class="btn center" id="mClose">시작하기 ▶</button>`); }

// ===== 실시간: 시간이 흐르고 이자가 쌓인다 =====
let __last=Date.now(), __saveAcc=0;
function liveTick(){
  const now=Date.now(), dt=Math.min(1,(now-__last)/1000); __last=now;
  if(!S||!S.month&&S.month!==0) return;
  if(adOn||!["event","chat","quiz","result"].includes(S.phase)||document.hidden||$("#modalRoot").innerHTML) return;
  S.dayAcc=(S.dayAcc||0)+dt/SEC_PER_DAY;
  while(S.dayAcc>=1){S.dayAcc-=1; S.day=(S.day||1)+1; S.finance+=perDay();
    if(S.day>DAYS){ monthTick(true); addLog("⏳ 결재가 늦어져 한 달이 그냥 지났습니다"); toast("⏳ 결재가 늦어져 한 달이 지났습니다. 운영비와 이자가 나갔어요."); render(); return; } }
  const e=econ(S), rise=(e.dues-S.dues0)/S.dues0*100, set=(id,t)=>{const el=document.getElementById(id); if(el) el.textContent=t;};
  set("clk",`${dateStr(S.month)} ${S.day}일`); set("finV",(S.finance*CX(S).cs).toFixed(2)+"억"); set("duesV",fmtEok(e.dues));
  set("riseV",(rise>=0?"+":"")+rise.toFixed(1)+"%"); set("ratioV",e.ratio.toFixed(1)+"%");
  const v=viability(), ve=document.getElementById("viaV"); if(ve){ve.textContent=v[0]; ve.className="small "+v[1];}
  const mb=document.getElementById("mbar"); if(mb) mb.style.width=((S.day+S.dayAcc)/DAYS*100).toFixed(1)+"%";
  __saveAcc+=dt; if(__saveAcc>5){__saveAcc=0; save();}
}
function toast(t){const d=document.createElement("div"); d.className="toast"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),3200);}
setInterval(liveTick,200);
